; ESP32-C3 を 2.4GHz スニファにする（AP の送信内容を観測する 2 台目）
;   pio run -t upload --upload-port /dev/cu.usbmodemXXXX
;   python3 tools/serial_sniff.py /dev/cu.usbmodemXXXX 30
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 921600
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=0
